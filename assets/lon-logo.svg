<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">LON logo</title>
  <desc id="desc">A bracketed compact data table beside the geometric LON wordmark.</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="24" x2="936" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1426"/>
      <stop offset="1" stop-color="#11182D"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="70" x2="838" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(128 82) rotate(51) scale(210 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(786 260) rotate(-126) scale(250 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="8" y="8" width="944" height="304" rx="72"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="944" height="304" rx="72" fill="url(#background)"/>
  <g clip-path="url(#frameClip)">
    <rect x="8" y="8" width="944" height="304" fill="url(#glowCyan)"/>
    <rect x="8" y="8" width="944" height="304" fill="url(#glowViolet)"/>
    <path d="M-10 274C166 224 246 314 414 270C590 224 706 130 970 174" stroke="url(#accent)" stroke-opacity="0.08" stroke-width="64"/>
  </g>
  <rect x="9" y="9" width="942" height="302" rx="71" stroke="#334155" stroke-opacity="0.7" stroke-width="2"/>

  <g>
    <rect x="52" y="52" width="216" height="216" rx="58" fill="#0A1628" fill-opacity="0.92"/>
    <rect x="54" y="54" width="212" height="212" rx="56" stroke="url(#accent)" stroke-width="4"/>
    <path d="M122 100H105C96.163 100 89 107.163 89 116V204C89 212.837 96.163 220 105 220H122" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 100H215C223.837 100 231 107.163 231 116V204C231 212.837 223.837 220 215 220H198" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#softGlow)" stroke="url(#accent)" stroke-linecap="round">
      <path d="M148 126H204" stroke-width="10"/>
      <path d="M148 160H192" stroke-width="10"/>
      <path d="M148 194H211" stroke-width="10"/>
    </g>
    <path d="M140 143H212" stroke="#64748B" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="140" cy="126" r="5" fill="#67E8F9"/>
    <circle cx="140" cy="160" r="5" fill="#A78BFA"/>
    <circle cx="140" cy="194" r="5" fill="#F9A8D4"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M360 94V224H455"/>
    <rect x="494" y="94" width="132" height="130" rx="65"/>
    <path d="M674 224V94L816 224V94"/>
  </g>
  <g fill="none" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 94V224H455"/>
    <rect x="494" y="94" width="132" height="130" rx="65"/>
    <path d="M674 224V94L816 224V94"/>
  </g>
  <path d="M360 260H816" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <circle cx="360" cy="260" r="4" fill="#22D3EE"/>
  <circle cx="588" cy="260" r="4" fill="#8B5CF6"/>
  <circle cx="816" cy="260" r="4" fill="#F472B6"/>
</svg>
