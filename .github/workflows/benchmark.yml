name: Benchmark

on:
  push:

permissions:
  contents: read

jobs:
  benchmark:
    name: Token efficiency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Install benchmark dependencies
        working-directory: benchmark
        run: bun install --frozen-lockfile

      - name: Run benchmark
        working-directory: benchmark
        run: bun run benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lon-token-efficiency-${{ github.sha }}
          path: |
            benchmark/results/token-efficiency.json
            benchmark/results/token-efficiency.md
          if-no-files-found: error
          retention-days: 30
