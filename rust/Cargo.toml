[package]
name = "lon"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Compact, canonical, lossless JSON codec for AI-first data exchange with self-describing record tables."
license = "BSD-3-Clause"
homepage = "https://github.com/fluttercandies/lon"
documentation = "https://docs.rs/lon"
repository = "https://github.com/fluttercandies/lon"
readme = "README.md"
keywords = ["json", "codec", "serialization", "llm", "ai"]
categories = ["encoding", "parser-implementations", "text-processing"]
# The differential harness needs the sibling Dart package, never the registry.
# conformance.rs reads ../conformance/v1.json, which does not exist inside a
# packaged crate; differential.rs stays because it self-skips without a Dart SDK.
# The criterion benches are dev-only and stay out of the published crate.
exclude = [
    "tests/diff_harness.dart",
    "tests/conformance.rs",
    "benches",
]

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
criterion = "0.7"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "codec"
harness = false
